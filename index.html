<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 Departments</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #050a14;
      --bg-navy: #0b1428;
      --card-border: rgba(255, 255, 255, 0.11);
      --card-border-top: rgba(255, 255, 255, 0.24);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --gold-primary: #dfc068;
      --gold-light: #f4df9b;
      --gold-border: rgba(223, 192, 104, 0.42);
      --sapphire-light: #60a5fa;
      --sapphire-mid: #2563eb;
      --link-text: #93c5fd;
      --link-visited: #c4b5fd;
      --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37, 99, 235, 0.22), transparent 70%),
        radial-gradient(ellipse 55% 40% at 88% 12%, rgba(223, 192, 104, 0.09), transparent 65%),
        radial-gradient(ellipse 65% 50% at 10% 90%, rgba(29, 78, 216, 0.16), transparent 70%),
        linear-gradient(160deg, #050a14 0%, #0b1428 50%, #060b16 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle executive architectural grid backdrop */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 58px 20px 64px;
      position: relative;
      z-index: 1;
    }

    .header-wrap {
      text-align: center;
      margin-bottom: 36px;
    }

    .page-header {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Inter", sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.25;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 65%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
    }

    .header-divider {
      width: 120px;
      height: 2px;
      margin: 20px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      opacity: 0.72;
    }

    .table-responsive {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: linear-gradient(
        155deg,
        rgba(34, 49, 82, 0.56) 0%,
        rgba(14, 23, 44, 0.84) 50%,
        rgba(8, 14, 28, 0.94) 100%
      );
      border: 1px solid var(--card-border);
      border-top: 1px solid var(--card-border-top);
      border-radius: 20px;
      box-shadow:
        var(--shadow-card),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* Glossy top-glass sheen */
    .table-responsive::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 110px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.065) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      z-index: 0;
    }

    table {
      position: relative;
      z-index: 1;
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    tbody tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      transition: background-color 0.22s ease, box-shadow 0.22s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.022);
    }

    tbody tr:hover {
      background-color: rgba(37, 99, 235, 0.1);
      box-shadow: inset 3px 0 0 var(--gold-primary);
    }

    td {
      padding: 24px 28px;
      font-size: 16px;
      line-height: 1.85;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-wrap: break-word;
      color: #e2e8f0;
    }

    .step-title {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold-light);
      background: linear-gradient(180deg, rgba(223, 192, 104, 0.18) 0%, rgba(180, 140, 45, 0.07) 100%);
      border: 1px solid var(--gold-border);
      padding: 5px 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    .step-title::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 8px var(--gold-primary);
      flex-shrink: 0;
    }

    a {
      display: inline-block;
      color: var(--link-text);
      text-decoration: none;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.22) 0%, rgba(29, 78, 216, 0.12) 100%);
      border: 1px solid rgba(96, 165, 250, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 4px 12px rgba(0, 0, 0, 0.22);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    a:hover {
      color: #ffffff;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-color: rgba(244, 223, 155, 0.55);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    a:visited {
      color: var(--link-visited);
      border-color: rgba(167, 139, 250, 0.32);
    }

    a:visited:hover {
      color: #ffffff;
      border-color: rgba(244, 223, 155, 0.55);
    }

    @media (max-width: 600px) {
      .container {
        padding: 32px 12px 44px;
      }
      .page-header {
        font-size: 1.75rem;
      }
      .table-responsive {
        border-radius: 16px;
      }
      td {
        padding: 18px 16px;
        font-size: 15px;
        line-height: 1.75;
      }
      a {
        padding: 5px 11px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-wrap">
      <h1 class="page-header">4 Departments</h1>
      <div class="header-divider"></div>
    </div>
    <div class="table-responsive">
      <table>
        <tbody>
          <tr>
            <td>
              <span class="step-title">Step#1: Product</span><br>
              <a href="https://spmhqo.github.io/sell/" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/sell/</a>
            </td>
          </tr>
          <tr>
            <td>
              <span class="step-title">Step#2: Community Content</span><br>
              <a href="https://spmhqo.github.io/master/p.html" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/master/p.html</a>
            </td>
          </tr>
          <tr>
            <td>
              <span class="step-title">Step#3: Meta</span><br>
              <a href="https://spmhqo.github.io/fba/" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/fba/</a>
            </td>
          </tr>
          <tr>
            <td>
              <span class="step-title">Step#4: WhatsApp</span><br>
              <a href="https://spmhqo.github.io/wa/" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/wa/</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
