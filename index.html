<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 Departments</title>
  <link rel="icon" href="spm.ico">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .page-header {
      margin: 0 0 16px 0;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }
    .table-responsive {
      width: 100%;
      overflow: hidden;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    tbody tr {
      border-bottom: 1px solid #e2e8f0;
    }
    tbody tr:last-child {
      border-bottom: none;
    }
    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }
    td {
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.75;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-wrap: break-word;
    }
    .step-title {
      display: inline-block;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    a {
      color: #2563eb;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:hover {
      color: #1d4ed8;
    }
    a:visited {
      color: #7c3aed;
    }
    @media (max-width: 600px) {
      .container {
        padding: 12px 10px;
      }
      .page-header {
        font-size: 20px;
        margin-bottom: 12px;
      }
      td {
        padding: 12px;
        font-size: 15px;
        line-height: 1.7;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="page-header">4 Departments</h1>
    <div class="table-responsive">
      <table>
        <tbody>
          <tr>
            <td>
              <span class="step-title">Step#1: Product</span><br>
              <a href="https://spmhqo.github.io/sell/" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/sell/</a>
            </td>
          </tr>
          <tr>
            <td>
              <span class="step-title">Step#2: Community Content</span><br>
              <a href="https://spmhqo.github.io/master/p.html" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/master/p.html</a>
            </td>
          </tr>
          <tr>
            <td>
              <span class="step-title">Step#3: Meta</span><br>
              <a href="https://spmhqo.github.io/fba/" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/fba/</a>
            </td>
          </tr>
          <tr>
            <td>
              <span class="step-title">Step#4: WhatsApp</span><br>
              <a href="https://spmhqo.github.io/wa/" target="_blank" rel="noopener noreferrer">https://spmhqo.github.io/wa/</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
